<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky1)"/>
  <!-- Adjacent urban skyline -->
  <rect x="0" y="110" width="120" height="230" fill="#E2E8F0"/>
  <rect x="680" y="90" width="120" height="250" fill="#E2E8F0"/>
  <!-- Main Corner Building -->
  <rect x="90" y="60" width="620" height="280" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="90" y="60" width="620" height="48" fill="#0F172A"/>
  <!-- Fascia Sign -->
  <rect x="130" y="72" width="220" height="24" rx="4" fill="#2563EB"/>
  <text x="240" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">DENTAI PRO • BANDRA W</text>
  <!-- Floor-to-ceiling 45ft Glass Storefront -->
  <rect x="115" y="125" width="570" height="205" rx="4" fill="url(#glass1)"/>
  <rect x="125" y="135" width="550" height="185" fill="url(#glow1)"/>
  <!-- Mullions -->
  <line x1="255" y1="125" x2="255" y2="330" stroke="#E2E8F0" stroke-width="4"/>
  <line x1="395" y1="125" x2="395" y2="330" stroke="#E2E8F0" stroke-width="4"/>
  <line x1="535" y1="125" x2="535" y2="330" stroke="#E2E8F0" stroke-width="4"/>
  <!-- Glass reflections -->
  <polygon points="140,130 210,130 165,325 120,325" fill="#FFFFFF" opacity="0.12"/>
  <polygon points="415,130 475,130 430,325 395,325" fill="#FFFFFF" opacity="0.1"/>
  <!-- Sidewalk & Palm Silhouettes -->
  <rect x="0" y="330" width="800" height="70" fill="#CBD5E1"/>
  <rect x="0" y="330" width="800" height="8" fill="#94A3B8"/>
  <circle cx="65" cy="240" r="36" fill="#10B981" opacity="0.85"/>
  <rect x="61" y="270" width="8" height="60" fill="#64748B"/>
  <circle cx="740" cy="248" r="32" fill="#10B981" opacity="0.85"/>
  <rect x="736" y="275" width="8" height="55" fill="#64748B"/>
</svg>
